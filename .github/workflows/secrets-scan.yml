name: Secrets scan

# Added 2026-11-18 (Engineering Standard §2): the pre-public gitleaks
# scan of 2026-11-15 was a one-off manual run. This makes the secrets
# scan a standing gate on every push and pull request instead.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
